<!doctype html><meta charset="utf-8"><title>珠宝店主助手 MVP</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto;background:#f6f7f2;color:#17352b}textarea{width:100%;height:90px;padding:12px}button{padding:10px 18px;margin:6px 6px 0 0;border:1px solid #b7c8be;border-radius:8px;background:white;cursor:pointer}.preset{background:#edf7f0}.msg{padding:14px;margin:12px 0;background:white;border-radius:12px;white-space:pre-wrap}.tool{color:#687a72;font-size:13px}</style><h1>珠宝店主助手</h1><p>一个 Agent，四个能力：相册整理 · 商品卡 · 销售接待 · 内容策划</p><section class="msg" aria-label="示例演示店"><b>示例演示店 · 自动销售接待</b>
<div><a id="anran-shop-link" href="__SALES_GUEST_ORIGIN__/demo/shop?sku=DEMO105" target="_blank" rel="noopener">打开演示店铺 ↗</a> · <a href="__SALES_OWNER_ORIGIN__/demo/owner" target="_blank" rel="noopener">独立打开店主同步窗口 ↗</a></div>
<div id="anran-watch-state" class="tool" role="status">正在连接店主同步…</div>
</section>
<dialog id="anran-sales-dialog" aria-labelledby="anran-sales-title">
  <header><div><b id="anran-sales-title">示例店铺 · 自动回复已送达</b><div class="tool">左右显示同一条会话。回复已发送，店主只需查看。</div></div>
  <form method="dialog"><button autofocus type="submit">关闭</button></form></header>
  <div class="anran-views">
    <section><h2>示例店铺 · 顾客视图</h2><iframe id="anran-shop-frame" title="示例店铺 · 原会话镜像"></iframe></section>
    <section><h2>店主同步窗口</h2><iframe id="anran-owner-frame" title="店主同步窗口" src="__SALES_OWNER_ORIGIN__/demo/owner"></iframe></section>
  </div>
</dialog>
<style>
#anran-sales-dialog{box-sizing:border-box;width:min(1220px,96vw);max-width:none;padding:16px;border:1px solid #b7c8be;border-radius:14px;background:#f6f7f2;color:#17352b}
#anran-sales-dialog::backdrop{background:#15241faa}
#anran-sales-dialog header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.anran-views{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.anran-views section{min-width:0}
.anran-views h2{font-size:15px;margin:12px 0 5px}
.anran-views iframe{box-sizing:border-box;display:block;width:100%;height:70dvh;min-height:250px;border:1px solid #b7c8be;border-radius:8px;background:white}
@media(max-width:680px){.anran-views{grid-template-columns:1fr}}
</style><div id="log"></div><textarea id="q" placeholder="可以点击下面的演示按钮，也可以自己输入"></textarea><button id="send">发送</button><div><button class="preset" data-text="把今天这批珠宝照片按实物分组，先不要建卡">相册整理</button><button class="preset" data-text="根据刚才的分类结果，自动为每件建立一个结构化商品卡 JSON 文件，字段包括颜色、品类、类型、材质、形态，先保存草稿">商品卡</button><button id="open-sales" type="button" class="preset">销售接待</button><button class="preset" data-text="想看戴起来多大，给我列三个镜头，先别做片">演示：内容策划</button></div><style>.album-result{display:inline-block;padding:18px 24px;margin:14px 0;background:#175640;color:white;border-radius:14px;font-size:22px;font-weight:700;text-decoration:none;min-height:58px}.album-result:focus{outline:3px solid #ad8b43}</style><script>
const log = document.querySelector('#log'), q = document.querySelector('#q');
const salesDialog = document.querySelector('#anran-sales-dialog');
const shopFrame = document.querySelector('#anran-shop-frame');
const ownerFrame = document.querySelector('#anran-owner-frame');
const ownerOrigin = new URL(ownerFrame.src).origin;
const watchState = document.querySelector('#anran-watch-state');
let seenSale = null;
window.addEventListener('message', ({origin, source, data}) => {
  if (origin !== ownerOrigin || source !== ownerFrame.contentWindow || data?.type !== 'anran-sales-feed') return;
  const reply = data.reply;
  if (reply !== null && (!Number.isSafeInteger(reply.seq) || typeof reply.threadId !== 'string' || typeof reply.messageId !== 'string')) return;
  const seq = reply?.seq || 0;
  watchState.textContent = '已连接 · 回复发出后自动展示两窗';
  if (seenSale === null) { seenSale = seq; return; }
  if (seq <= seenSale) return;
  seenSale = seq;
  salesDialog.dataset.threadId = reply.threadId;
  salesDialog.dataset.messageId = reply.messageId;
  const params = new URLSearchParams({thread:reply.threadId, message:reply.messageId});
  shopFrame.src = ownerOrigin + '/demo/owner-shop?' + params;
  ownerFrame.contentWindow.postMessage({type:'anran-sales-focus', threadId:reply.threadId, messageId:reply.messageId}, ownerOrigin);
  if (!salesDialog.open) salesDialog.showModal();
});
function add(label, value, meta) {
  const row = document.createElement('div');
  row.className = 'msg';
  if (meta) {
    const badge = document.createElement('div'); badge.className = 'tool';
    badge.textContent = meta; row.append(badge);
  }
  const name = document.createElement('b'); name.textContent = label;
  row.append(name, document.createTextNode(value)); log.append(row);
  return row;
}
async function run(text) {
  if (!text) return;
  add('店主：', text); q.value = '';
  try {
    const r = await fetch('/api/chat', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text})}).then(x=>x.json());
    const sales = r.tool === 'sales_prepare_reply' ? r.receipt?.result : null;
    const album = r.tool === 'album_classify_batch';
    const catalog = r.tool === 'catalog_create_or_read_card' && r.receipt?.result?.classificationMode === 'deepseek_vision' && r.reply?.includes('href="/catalog"');
    const reply = album || catalog ? r.reply.replace(/<a class="album-result" href="\/(?:gallery|catalog)"[^>]*>[^<]*<\/a>\n/, '') : r.reply;
    const row = add(sales ? '销售草稿（未发送）：' : '助手：', reply || r.error || '暂无回复', [r.mode,r.tool].filter(Boolean).join(' · '));
    if (sales?.sources?.length) {
      const info = document.createElement('div'); info.className = 'tool';
      info.textContent = '参考来源：' + sales.sources.join('；'); row.append(info);
    }
    if (album || catalog) {
      const a = document.createElement('a'); a.href = catalog ? '/catalog' : '/gallery'; a.target = '_blank'; a.rel = 'noopener';
      a.className = 'album-result'; a.textContent = catalog ? '🛍 查看商品卡 →' : '📷 查看分好的照片 →'; row.append(document.createElement('br'), a);
    }
  } catch { add('助手：', '连接失败，请检查本地演示服务。'); }
}
document.querySelector('#send').onclick = () => run(q.value.trim());
document.querySelector('#open-sales').onclick = () => document.querySelector('#anran-shop-link').click();
document.querySelectorAll('.preset[data-text]').forEach(b => b.onclick = () => run(b.dataset.text));
</script>
