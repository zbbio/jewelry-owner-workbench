<aside id="k2-panel" aria-labelledby="k2-heading" hidden>
  <header><h2 id="k2-heading">近期任务与待我确认</h2><button type="button" id="k2-close">收起</button></header>
  <p id="k2-status" role="status" aria-live="polite"></p>
  <button type="button" id="k2-refresh">刷新列表</button>
  <h3>待我确认</h3><p class="k2-hint">点一项先看原消息和后果，查看不是同意。</p><div id="k2-pending"></div>
  <h3>近期任务</h3><p class="k2-hint">最近有活动的五个话题，各取最后一条消息。</p><div id="k2-recent"></div>
  <h3>本店能力</h3><p class="k2-hint">挂载是接入状态，不代表当前操作已获准。</p><ul id="k2-ready"></ul>
</aside>
