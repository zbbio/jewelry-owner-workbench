<title>珠宝店主助手 MVP</title><style>:root{--ink:#23372f;--dim:#586960;--quiet:#64746b;--green:#215c47;--pale:#eaf1e8;--paper:#fafaf5;--line:#dbe0d6;--card:#fffefa;--serif:"Noto Serif SC","Songti SC","SimSun",serif;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper)}

<script>
const log=document.querySelector('#log'),q=document.querySelector('#q'),view=document.querySelector('#view');let busy=false;
function addMessage(kind,label,text,tool){const box=document.createElement('div');box.className='msg msg--'+kind;if(tool){const note=document.createElement('div');note.className='tool';note.textContent=tool;box.append(note);}if(label){const title=document.createElement('b');title.textContent=label+'：';box.append(title);}box.append(document.createTextNode(text));log.append(box);view.scrollTop=view.scrollHeight;return box;}
/* reference-video-ui:start */
const refTurnPath='/api/message-photos/video-turns', refId=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
const referenceCards=new Map();
let referenceTimer, referenceReading=false, referenceRefreshQueued=false;
function queueReferenceScan(ms=0){
 clearTimeout(referenceTimer);referenceTimer=setTimeout(()=>void scanReferenceTurns(),ms);
}
function showReferenceTurn(turn,job=turn?.job){
 if(!refId.test(turn?.id||''))return;
 const actual=refId.test(job?.id||'')?job:null;
 let card=referenceCards.get(turn.id);
 if(!card?.isConnected){
   card=addMessage('assistant','','');card.classList?.add('video-card','reference-video-card');
   card.dataset.referenceTurnId=turn.id;referenceCards.set(turn.id,card);
 }
 if(refId.test(turn.messageId||'')){
   const anchor=document.querySelector('[data-photo-message-id="'+turn.messageId+'"]');
   if(anchor&&card.previousElementSibling!==anchor)anchor.after(card);
 }
 log.hidden=false;
 const title=document.createElement('strong');title.textContent=actual?.name||'风格内容 · 参考视频';
 const desc=document.createElement('p');desc.setAttribute('role','status');
 desc.textContent=actual?.status==='ready'&&actual.mediaUrl==='/style-video/media/'+actual.id?
   (actual.reused?'复用已有成片，未新生成。':'视频已完成，可打开顾客单片。'):
   actual?.status==='processing'?'视频任务处理中，尚未完成。':
   actual?.status==='unknown'?'结果暂不明确，未自动重试。':
   actual?.status==='failed'?'视频任务未完成，未自动重试。':turn.reply||'等待视频工作流回执。';
 const rows=[title,desc];
 if(actual){
   const caution=document.createElement('p');caution.className='video-warning';
   caution.textContent=actual.warning||'AI合成，非实拍；商品细节以实物为准。';rows.push(caution);
 }
 if(actual?.status==='ready'&&actual.mediaUrl==='/style-video/media/'+actual.id){
   const link=document.createElement('a');link.className='album-result';link.target='_blank';link.rel='noopener noreferrer';
   link.href=actual.mediaUrl;link.textContent='打开顾客单片（MP4）';rows.push(link);
 }
 card.replaceChildren(...rows);
}
async function scanReferenceTurns(){
 if(referenceReading){referenceRefreshQueued=true;return}
 referenceReading=true;
 let again=false;
 async function get(u){
   const r=await fetch(u,{method:'GET',cache:'no-store',signal:AbortSignal.timeout(7000)});
   return r.ok&&!r.redirected?r.json():null;
 }
 try{
   const list=await get(refTurnPath);
   for(const turn of Array.isArray(list?.turns)?list.turns:[]){
     let job=turn.job;
     if(job?.status==='processing'&&refId.test(job.id||'')&&job.statusUrl==='/style-video/status/'+job.id){
       try{const got=await get(job.statusUrl);if(got?.job?.id===job.id)job=got.job}catch{}
     }
     showReferenceTurn(turn,job);
     if(turn.state==='routing'||job?.status==='processing')again=true;
   }
 }catch{}
 finally{
   referenceReading=false;
   if(referenceRefreshQueued){referenceRefreshQueued=false;queueReferenceScan()}
   else if(again)queueReferenceScan(1800);
 }
}
/* reference-video-ui:end */
/* uploaded-image-ui:start */
const imageTurnPath='/api/message-photos/image-turns', uploadedImageCards=new Map();
let imageTurnTimer,imageTurnReading=false,imageTurnQueued=false;
function queueImageScan(ms=0){
 clearTimeout(imageTurnTimer);imageTurnTimer=setTimeout(()=>void scanImageTurns(),ms);
}
function showUploadedImageTurn(turn,job=turn?.job,owner=null){
 if(!refId.test(turn?.id||''))return;
 if(owner)owner.dataset.imageRequestId=turn.id;
 let anchor=refId.test(turn.messageId||'')?document.querySelector('[data-photo-message-id="'+turn.messageId+'"]'):
   document.querySelector('[data-image-request-id="'+turn.id+'"]');
 if(!anchor&&!turn.messageId&&turn.userText){
   anchor=addMessage('owner','店主',turn.userText);anchor.dataset.imageRequestId=turn.id;
 }
 let card=uploadedImageCards.get(turn.id);
 if(!card?.isConnected){
   card=addMessage('assistant','','');card.dataset.imageTurnId=turn.id;uploadedImageCards.set(turn.id,card);
 }
 if(anchor&&card.previousElementSibling!==anchor)anchor.after(card);
 log.hidden=false;
 const key=JSON.stringify([turn.state,turn.reply,job]);
 if(card.dataset.resultKey===key)return;
 card.dataset.resultKey=key;
 const message=document.createElement('p');message.setAttribute('role','status');
 message.textContent=turn.reply||'等待图片工作流回执。';card.replaceChildren(message);
 if(job)showImageJob(job,card,{remember:false,uploaded:true});
}
async function scanImageTurns(){
 if(imageTurnReading){imageTurnQueued=true;return}
 imageTurnReading=true;let again=false;
 async function get(u){
   const r=await fetch(u,{method:'GET',cache:'no-store',signal:AbortSignal.timeout(7000)});
   return r.ok&&!r.redirected?r.json():null;
 }
 try{

 if(record){reflect(record);if(running(record))schedule(0);}
 window.addEventListener('online',()=>schedule(0));
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)schedule(0);});
 return {begin,attach,lastId:()=>record?.id};
}
const albumTracker=useJobTracker('album');
const catalogTracker=useJobTracker('catalog',albumTracker.lastId);


// This narrow grammar only admits overlap in the UI. The server/SDK still chooses
// the tool from the original text; ambiguous or combined commands keep the old lock.
function oldVideoProduct(text){
 const match=/^(?:请|帮我|请帮我|给我)?\s*(?:查看|查找|看看|查|看|播放|找)\s*(?:BCMLDIY)?([0-9]{3}[A-Z]?)\s*(?:号)?\s*(?:的)?\s*(?:旧|已有|已保存|(?:之前|以前)(?:做|制作|生成|保存)?的)(?:视频|短片|成片|作品)[。！!]?$/iu.exec(text.trim());
 return match?'BCMLDIY'+match[1].toUpperCase():null;
}
const chatSend=document.querySelector('#send');
q.addEventListener('input',()=>{if(videoReads)chatSend.disabled=!oldVideoProduct(q.value);});
const stripReplyLinks=reply=>reply.replace(/<a\b[^>]*>[\s\S]*?<\/a>/g,'');
const postChat=(text,signal)=>fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text}),signal});
async function readOldVideo(text,productId){
 videoReads++;
 const epoch=++videoEpoch;
 activeVideoId=null;clearTimeout(videoTimer);
 // A new selection must not keep playing or restore a different product if no work is found.
 // Prior text replies stay next to their own requests.
 for(const card of videoCards.values()){card.querySelector('video')?.pause();card.remove();}
 videoCards.clear();
 try{localStorage.removeItem(videoStorageKey);}catch{}
 document.querySelector('#welcome').hidden=true;log.hidden=false;
 document.querySelectorAll('button:not(#anran-return):not(#catalog-confirmation-open):not(#catalog-confirmation-close)').forEach(b=>b.disabled=true);
 addMessage('owner','店主',text);q.value='';
 const slot=addMessage('status','','正在查找 '+productId+' 的已有短片…');
 slot.setAttribute('role','status');
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),90000);
 try{
  const res=await postChat(text,controller.signal), r=await res.json();
  const wrongCard=r.videoJob&&(!isExistingVideoReply(r)||r.videoJob.productId!==productId);
  const reply=wrongCard?'返回的作品与所查货号不符，未打开作品。':r.reply||r.error||'本次未查到可用的旧片回执。';
  slot.textContent=productId+' · '+stripReplyLinks(reply);
  if(res.ok&&!wrongCard&&epoch===videoEpoch&&r.videoJob)renderContentReply(r,slot);
 }catch{
  slot.textContent=productId+(controller.signal.aborted?' · 查询等待超时，请重新查找。':' · 查询连接中断，请重新查找。');
 }finally{
  clearTimeout(timeout);
  if(--videoReads===0)document.querySelectorAll('button').forEach(b=>b.disabled=false);
 }
}
async function run(text){if(!text||busy)return;const videoProduct=oldVideoProduct(text);if(videoProduct)return readOldVideo(text,videoProduct);if(videoReads)return;busy=true;const intent=await jobIntent;const tracker=intent?.isAlbumIntent?.(text)?albumTracker:intent?.isCatalogIntent?.(text)?catalogTracker:null;if(tracker){try{await tracker.begin(text);}finally{busy=false;}return;}document.querySelector('#welcome').hidden=true;document.querySelector('#log').hidden=false;document.querySelectorAll('button:not(#anran-return):not(#catalog-confirmation-open):not(#catalog-confirmation-close)').forEach(b=>b.disabled=true);const owner=addMessage('owner','店主',text);q.value='';const pending=addMessage('status','','正在处理，请稍候；相册或商品卡批量任务需要几分钟。');pending.setAttribute('role','status');
try{const res=await postChat(text);const r=await res.json();if(refId.test(r.styleImageTurn?.id||'')){pending.remove();showUploadedImageTurn(r.styleImageTurn,r.styleImageTurn.job,owner);queueImageScan();return;}if(refId.test(r.styleVideoTurn?.id||'')){pending.remove();showReferenceTurn(r.styleVideoTurn);queueReferenceScan();return;}if(res.status===202&&jobIdOk(r.job?.id)){pending.remove();(r.job.kind==='catalog'||intent?.isCatalogIntent?.(text)||/分类结果.*商品卡/u.test(text)?catalogTracker:albumTracker).attach(text,r.job);return;}const failed=Boolean(r.error&&!r.reply);const answer=addMessage(failed?'status':'assistant',failed?'':'助手',stripReplyLinks(r.reply||r.error||'本次暂未完成'),null);if(failed)answer.setAttribute('role','status');if(r.tool==='image_replace_background'){pending.replaceWith(answer);}else{pending.remove();}renderContentReply(r,answer);if(r.receipt?.status==='completed'){const target=r.tool==='album_classify_batch'?['/gallery','查看分好的照片 →']:r.tool==='catalog_create_or_read_card'&&r.receipt.result?.classificationMode==='deepseek_vision'?['/catalog','查看商品卡 →']:null;if(target){const a=document.createElement('a');a.className='album-result';a.href=target[0];a.target='_blank';a.rel='noopener';a.textContent=target[1];answer.append(document.createElement('br'),a);}}}
catch{pending.textContent='连接暂时中断，请查看已有分类相册或商品卡，再重试。';}finally{view.scrollTop=view.scrollHeight;busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}}

const picks=[{"key":"album","icon":"pic","question":"帮我整理今天的照片","label":"相册整理","text":"把今天这批珠宝照片按实物分组，先不要建卡"},{"key":"catalog","icon":"bag","question":"帮我准备商品卡草稿","label":"商品档案","text":"根据刚才的分类结果，自动为每件建立一个结构化商品卡 JSON 文件，字段包括颜色、品类、类型、材质、形态，先保存草稿"},{"key":"sales","icon":"chat","question":"打开示例店铺销售接待","label":"销售接待"},{"key":"style","icon":"style","label":"风格内容"}];
function makeChoice(item,full){
 const icon=document.createElementNS('http://www.w3.org/2000/svg','svg');
 icon.setAttribute('class','ic');icon.setAttribute('aria-hidden','true');
 const ref=document.createElementNS(icon.namespaceURI,'use');ref.setAttribute('href','#'+item.icon);icon.append(ref);
 const b=document.createElement('button');b.type='button';b.className=full?'quick':'pill';b.dataset.preset=item.key;
 if(full){const badge=document.createElement('span');badge.className='badge';badge.append(icon);b.append(badge);}
 else b.append(icon);
 b.append(document.createTextNode(full?item.question:item.label));
 if(item.text)b.addEventListener('click',()=>{q.value=item.text;q.focus({preventScroll:true});});
 return b;
}
for(const item of picks.slice(0,3)) document.querySelector('#suggestions').append(makeChoice(item,true));

void import('/message-photo-ui.mjs').then(({setupMessagePhotos})=>{
 messagePhotos=setupMessagePhotos({q,addMessage,reveal:()=>{document.querySelector('#welcome').hidden=true;log.hidden=false}});
 document.querySelector('#message-photo-add').disabled=false;
 new MutationObserver(changes=>{

 }).observe(log,{childList:true});
 queueReferenceScan(250);queueImageScan(250);
},()=>{});
document.querySelector('#form').onsubmit=e=>{
 e.preventDefault();const text=q.value.trim();
 if(messagePhotos?.hasDraft()){
   if(busy||videoReads)return;
   busy=true;void messagePhotos.send(text).finally(()=>{busy=false});
