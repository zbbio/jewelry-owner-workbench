<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>店主端 · 示例销售接待</title>
<link rel="stylesheet" href="/demo/anran-support.css">
<style>#ar-back-to-assistant{position:sticky;top:0;z-index:1;margin:0 0 8px;padding:4px 0;background:#faf5ef}#ar-back-to-assistant a{display:inline-flex;align-items:center;min-height:44px}</style>
<main class="ar-owner" id="ar-owner">
  <p id="ar-back-to-assistant" hidden><a href="/">返回珠宝助手</a></p>
  <header><span class="ar-kicker">示例珠宝 · 云端演示</span><h1>销售接待</h1>
  <p>顾客消息自动回复 · 店主端同步</p>
  </header>
  <div id="ar-connection" role="status">连接中…</div>
  <div class="ar-owner-layout"><aside><h2>顾客会话</h2><div id="ar-threads"></div></aside>
  <section><h2 id="ar-thread-title">等待顾客来信</h2><div id="ar-owner-messages" class="ar-log" role="log"></div></section></div>
</main>
<script>if(window.self===window.top)document.getElementById("ar-back-to-assistant").hidden=false;</script>
<script defer src="/demo/anran-support.js" data-view="owner"></script>
</html>
