<style>

*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #4f7254;outline-offset:3px}button{border:0;background:none}button:disabled{opacity:.45;cursor:not-allowed}.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-width:1040px;margin:0 auto}.mast{display:flex;align-items:center;justify-content:space-between;padding:17px 34px;border-bottom:1px solid var(--line);gap:12px}.identity,.head-actions,.ctx,.round,.pill,.entry,.send,.voice-hold,.call-mode,.quick,.tile,.select-btn{display:flex;align-items:center}.identity{gap:11px}.sig{display:grid;place-items:center;width:39px;height:39px;border-radius:14px;background:var(--green);color:#fff}.sig svg{width:25px;height:25px}.name{font-weight:650;font-size:18px;line-height:1.3;letter-spacing:.03em}.sub{font-size:10px;color:var(--quiet);letter-spacing:.08em}.head-actions{gap:9px}.ctx,.round{border:1px solid var(--line);border-radius:30px;background:var(--card);justify-content:center}.ctx{gap:5px;padding:7px 11px;font-size:12px;font-weight:600}.ctx .ic:first-child{width:16px}.ctx .chev{width:13px}.round{width:37px;height:37px;padding:0}.view{min-height:0;overflow:auto;scrollbar-width:thin;overscroll-behavior:contain}.inner{width:min(100%,760px);padding:0 24px;margin:0 auto}.welcome{padding:clamp(26px,6vh,68px) 0 19px}.eyebrow{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:650;letter-spacing:.16em;color:#59715f}.eyebrow:before{content:"";width:24px;height:1px;background:#8ca491}.hero{display:grid;grid-template-columns:minmax(0,1fr) clamp(94px,18vw,170px);align-items:center;gap:12px;margin:13px 0 1px}.hero h1{font:500 clamp(30px,4.3vw,47px)/1.2 var(--serif);letter-spacing:.025em;margin:0 0 12px}.hero p{font-size:14px;color:var(--dim);margin:0;max-width:32em}.pendant{width:100%;height:auto;max-height:145px;display:block}.tour{font-size:12px;color:var(--dim);margin:12px 0 -7px}.suggestions{display:flex;flex-wrap:wrap;gap:7px;margin:19px 0 0}.quick{font-size:12px;gap:6px;border:1px solid #dbe2d6;border-radius:22px;padding:7px 11px;background:#f3f6ee}.quick .ic{width:13px;height:13px}.chat{display:flex;flex-direction:column;gap:12px;padding:9px 0 20px}.turn{max-width:88%;display:flex;flex-direction:column;align-items:flex-start;gap:3px}.turn.user{align-self:flex-end;align-items:flex-end}.tag{font-size:10px;letter-spacing:.025em;color:var(--quiet)}.bubble{margin:0;padding:10px 13px;border-radius:15px 15px 15px 4px;background:#fffefa;border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.user .bubble{background:var(--green);color:#fff;border-color:var(--green);border-radius:15px 15px 4px 15px}.turn.note .bubble{border:0;border-left:2px solid #c1cebd;border-radius:0;padding:2px 0 2px 9px;background:none;color:var(--dim);font-size:12px}.meta{font-size:11px;color:var(--dim);margin:1px 0 0}.meta summary{cursor:pointer}.meta pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0}.dock{width:min(100%,760px);margin:auto;padding:4px 24px max(12px,env(safe-area-inset-bottom));background:var(--paper)}.rail-info{font-size:10px;letter-spacing:.09em;color:var(--quiet);display:flex;justify-content:space-between;align-items:center;padding:0 1px}.rail-info span:last-child{letter-spacing:0}.rail{display:flex;overflow-x:auto;overscroll-behavior-x:contain;gap:7px;padding:5px 1px 9px;scrollbar-width:thin;scroll-snap-type:x proximity}.pill{border:1px solid var(--line);border-radius:20px;background:var(--card);font-size:12px;gap:6px;white-space:nowrap;padding:7px 11px;scroll-snap-align:start;flex:none}.pill .ic{width:15px;height:15px}.pill[aria-pressed=true]{background:#dceada;border-color:#92ae96;color:#204f38}.task-panel{display:none;background:#edf3e9;border:1px solid #d6e1d1;border-radius:12px;padding:7px 10px;font-size:12px;margin-bottom:7px;gap:7px;align-items:center}.task-panel.show{display:flex}.task-panel strong{white-space:nowrap}.task-panel span{flex:1;color:var(--dim)}.task-panel button{color:var(--green);font-size:12px;white-space:nowrap;text-decoration:underline;text-underline-offset:3px}.entry{gap:8px;background:var(--card);border:1px solid #bcc8b9;border-radius:20px;padding:7px 9px;box-shadow:0 2px 10px #2846320a}.entry:focus-within{border-color:#54846b}.entry .call-mode{align-self:center;background:#f0f3eb;border-radius:50%;width:34px;height:34px;padding:0;justify-content:center}.entry textarea{width:100%;min-width:0;resize:none;background:transparent;border:0;outline:none;padding:5px 0;color:var(--ink);line-height:1.5;height:35px}.entry textarea::placeholder{color:#718075}.send{width:35px;height:35px;background:var(--green);color:white;border-radius:50%;justify-content:center;padding:0;flex:none}.send .ic{width:18px;height:18px}.footnote{font-size:10px;color:var(--quiet);text-align:center;margin-top:5px;min-height:14px}.voice-hold{min-width:0;flex:1;justify-content:center;font-weight:600;font-size:14px;padding:5px 0;user-select:none;touch-action:none}.voice-hold.holding{color:var(--green);background:var(--pale);border-radius:9px}.sr{position:absolute!important;width:1px;height:1px;margin:-1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}[hidden]{display:none!important}dialog{color:var(--ink);border:1px solid var(--line);border-radius:24px;background:var(--card);width:min(calc(100% - 28px),390px);max-height:85dvh;padding:24px;box-shadow:0 14px 70px #192c2330}dialog::backdrop{background:#1e332a5c}dialog h2{font:500 25px/1.3 var(--serif);margin:10px 0}.dialog-top{display:flex;justify-content:space-between;align-items:center}.dialog-top .round{width:30px;height:30px}.dialog-top .ic{width:15px}dialog p{margin:7px 0 13px;color:var(--dim);font-size:13px}.cards{display:grid;gap:7px}.select-btn{width:100%;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:11px;text-align:left}.select-btn.active{background:var(--pale);border-color:#a1b59b}.select-btn small{color:var(--quiet)}.call-center{text-align:center}.orb{margin:16px auto;display:grid;place-items:center;background:radial-gradient(ellipse at 35% 30%,#dceacb,#9abd9d 65%,#739e81);border:1px solid #aac4a7;color:var(--green);border-radius:50%;width:94px;height:94px;box-shadow:0 0 0 8px #eff3e8}.orb svg{width:36px;height:36px}.primary{border-radius:30px;background:var(--green);color:#fff;padding:8px 18px}.secondary{border:1px solid var(--line);border-radius:30px;padding:8px 14px}.dialog-ops{display:flex;gap:7px;justify-content:center}
@media(max-width:580px){.mast{padding:11px 14px}.inner,.dock{padding-left:16px;padding-right:16px}.sig{width:34px;height:34px;border-radius:11px}.name{font-size:16px}.head-actions{gap:5px}.ctx{padding:6px 8px}.welcome{padding-top:clamp(26px,6vh,48px)}.hero{grid-template-columns:minmax(0,1fr) 88px;gap:2px}.hero h1{font-size:30px;margin-bottom:8px}.hero p{font-size:13px}.suggestions{margin-top:13px}.rail-info{padding-top:2px}.turn{max-width:93%}.pill{padding:7px 11px}.task-panel{flex-wrap:wrap}.task-panel span{min-width:100px}.entry{border-radius:18px}.footnote{margin-top:4px}}
@media (max-height:590px){.welcome{padding:14px 0 8px}.hero{grid-template-columns:1fr}.pendant,.welcome .eyebrow{display:none}.hero h1{font-size:22px}.hero p,.suggestions{font-size:12px}.suggestions{margin-top:8px}}
.app{width:100%;grid-template-columns:minmax(0,1fr)}.app>*{min-width:0}.rail{min-width:0;max-width:100%;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}.pill{min-width:99px;justify-content:center}.dock{min-width:0}.hero>div{min-width:0}[hidden]{display:none!important}</style></head>

<symbol id="bag" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="15" rx="3"/><path d="M8 7V5a4 4 0 0 1 8 0v2m-8 6h8m-8 4h5"/></symbol>

<div class="app">
<header class="mast"><div class="identity"><span class="sig"><svg viewBox="0 0 30 30" fill="none" aria-hidden="true"><path d="m15 3 9 10-9 14-9-14zM6 13h18m-14-5 5 19 5-19" stroke="currentColor" stroke-width="1.35"/></svg></span><div><div class="name">珠宝智能体</div><div class="sub">测试店 · 原商品卡</div></div></div>
<div class="head-actions"><button id="cardPick" class="ctx" aria-haspopup="dialog" title="选择当前商品"><svg class="ic"><use href="#gem"/></svg><span id="cardName">未选商品</span><svg class="ic chev"><use href="#chev"/></svg></button>
<button hidden disabled id="call" class="round" aria-label="语音通话预览" title="语音通话预览"><svg class="ic"><use href="#phone"/></svg></button></div></header>
<main id="view" class="view"><div class="inner"><section class="welcome" id="welcome">
<div class="eyebrow">店 主 的 珠 宝 手 记</div>
<div class="hero"><div><h1>今天想聊哪件货？</h1><p>从一张照片、一件商品，或顾客的一句话开始。</p></div>
<svg class="pendant" viewBox="0 0 155 130" aria-hidden="true" fill="none">
<ellipse cx="82" cy="112" rx="43" ry="4" fill="#dbe4d6" opacity=".65"/><path d="M39 5c3 28 12 48 36 64m48-64c-5 27-15 48-39 64" stroke="#9ca28a" stroke-width="1.2"/><path d="M43 5c3 28 12 47 33 60m43-60c-5 26-14 45-35 60" stroke="#b9baa1" stroke-width=".7"/><path d="m80 68 0 6" stroke="#a29363" stroke-width="4"/><ellipse cx="80" cy="68" rx="4" ry="6" stroke="#afa06a" stroke-width="2"/><path d="M80 72c-6 3-18 12-18 21 0 10 8 16 18 16s18-6 18-16c0-9-12-18-18-21z" fill="#8ba98e" stroke="#6d8a73"/><path d="M80 76c-6 4-14 11-14 17 0 7 6 12 14 12s14-5 14-12c0-6-8-13-14-17z" stroke="#d5e6d0" stroke-width="1"/><path d="M73 87c1-3 4-6 7-8" stroke="#e2ecda" stroke-width="2" stroke-linecap="round"/><path d="M116 51v9m-4.5-4.5h9M48 80v6m-3-3h6" stroke="#b7ad8d" stroke-width="1.1"/></svg></div>
<p class="tour">先选手上的商品，再问价格。没登记的售价，助手会告诉你待核实。</p><div class="suggestions"><button class="quick" id="askPrice" data-price="true"><svg class="ic"><use href="#chat"/></svg>这件多少钱？</button><button class="quick" data-suggest="这件商品有哪些已确认的资料？"><svg class="ic"><use href="#bag"/></svg>查商品资料</button><button class="quick" data-suggest="顾客问起这件货，我该怎么介绍？"><svg class="ic"><use href="#chat"/></svg>准备销售回复</button></div></section>
<section id="messages" class="chat" role="log" aria-label="对话消息" aria-live="polite"></section></div></main>
<footer class="dock"><div id="task" class="task-panel"><strong id="taskName"></strong><span id="taskHint"></span><button id="back" type="button">回到对话</button></div>
<div class="rail-info"><span>工作能力</span><span>可横向滑动</span></div><nav class="rail" id="rail" aria-label="四仓能力"></nav>
<form class="entry" id="form"><button hidden disabled id="voice" type="button" class="call-mode" aria-label="切换到按住说话预览" title="按住说话预览"><svg class="ic"><use href="#wave" id="voiceIcon"/></svg></button><textarea id="input" rows="1" maxlength="500" aria-label="消息内容" placeholder="说说你想做什么…" enterkeyhint="send"></textarea><button id="hold" type="button" class="voice-hold" hidden>按住说话 · 预览</button><button id="send" class="send" type="submit" aria-label="发送消息" title="发送" disabled><svg class="ic"><use href="#arr"/></svg></button></form>
<div id="foot" class="footnote" role="status"></div></footer></div>
<dialog id="picker" aria-labelledby="pickerTitle"><div class="dialog-top"><div class="eyebrow">商品上下文</div><button class="round" id="pickClose" aria-label="关闭选择商品"><svg class="ic"><use href="#x"/></svg></button></div><h2 id="pickerTitle">选择当前商品</h2><p>这里是测试店原来的两张商品卡。切换后，后续提问以新选的商品为准。</p><div class="cards" id="cards"></div></dialog>
<dialog id="phoneSheet" aria-labelledby="phoneTitle"><div class="dialog-top"><div class="eyebrow">交互预览</div><button class="round" id="callClose" aria-label="关闭通话预览"><svg class="ic"><use href="#x"/></svg></button></div><div class="call-center"><div class="orb"><svg class="ic"><use href="#wave"/></svg></div><h2 id="phoneTitle">语音通话预览</h2><p id="callState"></p><p>没有接通通话，也不会开启麦克风。结束预览后可继续打字。</p><div class="dialog-ops"><button class="secondary" id="mute">模拟静音</button><button class="primary" id="end">结束预览</button></div></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);
const fileMode=location.protocol==='file:';
const modeInfo={album:['相册整理','pic','预览入口；本样机不会上传、识别或归组照片。'],catalog:['商品档案','bag','查看本件已经确认的商品资料。'],sales:['销售问答','chat','根据本件已知资料准备回复。'],style:['风格内容','style','预览入口；本样机不会生成图片或制作视频。']};
const scope={productId:null,mode:null,version:0}; let ready=false, switching=false, seq=0; let pending=null,voiceMode=false,muted=false,lastFocus=null;
const nameOf=id=>id?'商品 '+id:'未选商品';const modeOf=id=>id?modeInfo[id][0]:'通用对话';
function n(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function icon(id){const s=document.createElementNS('http://www.w3.org/2000/svg','svg'),u=document.createElementNS(s.namespaceURI,'use');s.setAttribute('class','ic');s.setAttribute('aria-hidden','true');u.setAttribute('href','#'+id);s.append(u);return s}
function refreshSend(){const blocked=!ready||switching;$('cardPick').disabled=blocked;$('askPrice').disabled=blocked||!!pending;$('send').disabled=blocked||!$('input').value.trim()||!!pending||voiceMode;}
function foot(){if(voiceMode){$('foot').textContent='按住说话仅作预览，不录音、不转写。';return;}$('foot').textContent=fileMode?'离线布局预览 · 启动配套本地服务，打开终端显示的网址即可对话。':'只读查询测试店原商品卡 · 语音本轮未开放。';}
function scrollEnd(){requestAnimationFrame(()=>{$('view').scrollTop=$('view').scrollHeight})}
function add(kind,tag,text){const row=n('article','turn '+kind),lab=n('span','tag',tag),body=n('p','bubble',text);row.append(lab,body);$('messages').append(row);scrollEnd();return {row,lab,body}}
function change(){scope.version++;if(pending){pending.slot.lab.textContent='界面提示';pending.slot.body.textContent='已切换上下文，上一请求的回复不再显示。';pending=null;}refreshSend()}
function selectMode(id){if(scope.mode===id)return;change();scope.mode=id;for(const b of $('rail').children)b.setAttribute('aria-pressed',String(b.dataset.mode===id));$('task').classList.toggle('show',!!id);if(id){$('taskName').textContent=modeInfo[id][0];$('taskHint').textContent=modeInfo[id][2];$('input').placeholder='在「'+modeInfo[id][0]+'」里提问…';}else{$('input').placeholder='说说你想做什么…';}}
for(const [id,[name,sym]] of Object.entries(modeInfo)){const b=n('button','pill');b.type='button';b.dataset.mode=id;b.setAttribute('aria-pressed','false');b.append(icon(sym),n('span','',name));b.onclick=()=>selectMode(scope.mode===id?null:id);$('rail').append(b)}
$('back').onclick=()=>selectMode(null);
function showDialog(d,trigger){lastFocus=trigger;if(!d.open){if(d.showModal)d.showModal();else d.setAttribute('open','')}}
for(const id of ['picker','phoneSheet']){const d=$(id);d.addEventListener('close',()=>{if(lastFocus)lastFocus.focus();});d.addEventListener('click',ev=>{if(ev.target===d){const b=d.getBoundingClientRect();if(ev.clientX<b.left||ev.clientX>b.right||ev.clientY<b.top||ev.clientY>b.bottom)d.close();}})}
function paintCard(id){scope.productId=id;$('cardName').textContent=nameOf(id);$('cardPick').setAttribute('aria-label','选择当前商品：'+nameOf(id));$('cardName').dataset.seq=String(seq);}
async function syncSession(){const r=await fetch('/api/session',{cache:'no-store'});if(!r.ok)throw Error('请从测试店启动入口重新打开');const x=await r.json();if(!Number.isSafeInteger(x.seq)||![null,'A','B'].includes(x.productId))throw Error('会话未就绪');seq=x.seq;paintCard(x.productId);ready=true;}
async function selectCard(id){if($('picker').close)$('picker').close();else $('picker').removeAttribute('open');if(id===scope.productId||!ready||switching)return;change();switching=true;refreshSend();try{const next=seq+1;const r=await fetch('/api/selection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:id,seq:next})});if(!r.ok)throw Error('选择未保存');const d=await r.json();if(d.productId!==id||d.seq!==next)throw Error('选择回执不一致');seq=next;paintCard(id);}catch(e){ready=false;try{await syncSession()}catch(_){}add('note','界面提示','商品切换未确认，请核对顶部商品后再问。');}finally{switching=false;refreshSend();}}
$('cardPick').onclick=()=>{const box=$('cards');box.replaceChildren();for(const id of [null,'A','B']){const chosen=scope.productId===id,b=n('button','select-btn'+(chosen?' active':''));b.dataset.card=id||'none';b.setAttribute('aria-pressed',String(chosen));b.append(n('span','',id?nameOf(id):'暂不选商品'),n('small','',chosen?'当前选择':(id?'原商品卡':'通用提问')));b.onclick=()=>selectCard(id);box.append(b)}showDialog($('picker'),$('cardPick'))};
$('pickClose').onclick=()=>{if($('picker').close)$('picker').close();else $('picker').removeAttribute('open');};$('call').onclick=()=>{muted=false;$('mute').textContent='模拟静音';$('callState').textContent='当前：'+nameOf(scope.productId)+' · '+modeOf(scope.mode);showDialog($('phoneSheet'),$('call'))};$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'取消模拟静音':'模拟静音';$('callState').textContent=(muted?'模拟静音 · ':'当前：')+nameOf(scope.productId)+' · '+modeOf(scope.mode);};$('end').onclick=$('callClose').onclick=()=>$('phoneSheet').close();
function setVoice(v){voiceMode=v;$('hold').hidden=!v;$('input').hidden=v;$('send').hidden=v;$('voiceIcon').setAttribute('href',v?'#keyb':'#wave');$('voice').setAttribute('aria-label',v?'返回键盘输入':'切换到按住说话预览');endHold();foot();refreshSend()}
function beginHold(){$('hold').textContent='松开结束预览';$('hold').classList.add('holding');$('foot').textContent='正在预览按住动作 · 没有录音。'}
function endHold(){$('hold').textContent='按住说话 · 预览';$('hold').classList.remove('holding');if(voiceMode)foot()}
$('voice').onclick=()=>setVoice(!voiceMode);$('hold').onpointerdown=e=>{if(e.button!==0)return;try{$('hold').setPointerCapture(e.pointerId)}catch(_){}beginHold()};for(const k of ['pointerup','pointercancel','lostpointercapture','blur'])$('hold').addEventListener(k,endHold);$('hold').onkeydown=e=>{if([' ','Enter'].includes(e.key)){e.preventDefault();beginHold()}};$('hold').onkeyup=endHold;window.addEventListener('blur',endHold);
$('askPrice').onclick=()=>{if(voiceMode)setVoice(false);selectMode('sales');$('input').value='这件多少钱？';refreshSend();if(!pending)$('form').requestSubmit();};for(const b of document.querySelectorAll('[data-suggest]'))b.onclick=()=>{if(voiceMode)setVoice(false);$('input').value=b.dataset.suggest;refreshSend();$('input').focus()};
$('input').oninput=refreshSend;$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();if(!$('send').disabled)$('form').requestSubmit();}};
function brief(x){if(x==null)return '';if(typeof x==='string')return x.slice(0,650);try{return JSON.stringify(x,null,2).slice(0,900)}catch(_){return ''}}
function addEvidence(row,d){const det=n('details','meta');det.append(n('summary','','查看本条回执'));const out=[];if(Array.isArray(d.evidence)){for(const item of d.evidence.slice(0,10)){if(item&&typeof item.label==='string'&&typeof item.value==='string'){out.push((item.productId?'商品 '+item.productId+' · ':'')+item.label+'：'+item.value);}}}if(!out.length)out.push('本条没有商品事实引用。');const r=d.runtime;if(r&&typeof r==='object'){const tools=Array.isArray(r.toolCalls)?r.toolCalls.filter(x=>typeof x==='string').join('、'):'';if(typeof r.sdk==='string')out.push('运行：'+r.sdk+(typeof r.version==='string'?' '+r.version:'')+(r.offline===true?' · 离线':''));if(r.live&&r.model)out.push('模型：'+r.model);if(tools)out.push('调用：'+tools);for(const x of (r.toolReceipts||[]))out.push('原卡 '+x.cardId+' · v'+x.version);}det.append(n('pre','',out.join('\n')));row.append(det)}
$('form').onsubmit=async e=>{e.preventDefault();const text=$('input').value.trim();if(!ready||switching||!text||pending||voiceMode)return;const snapshot={productId:scope.productId,mode:scope.mode,version:scope.version,seq};const caption=nameOf(snapshot.productId)+' · '+modeOf(snapshot.mode);add('user','你 · '+caption,text);$('input').value='';refreshSend();if(fileMode){add('note','界面提示','当前是文件预览，没有发送消息。请启动配套本地服务，在浏览器打开终端显示的本机网址后再试。');return;}
const slot=add('note','正在发送 · '+caption,'正在查询原卡…'),controller=new AbortController(),job={slot,controller};pending=job;refreshSend();let timedOut=false;const timer=setTimeout(()=>{timedOut=true;controller.abort()},110000);
try{const res=await fetch('/api/agent/turn',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,productId:snapshot.productId,mode:snapshot.mode,seq:snapshot.seq}),signal:controller.signal});const d=await res.json();if(!res.ok)throw Object.assign(new Error(d.error?.message||('HTTP '+res.status)),{code:d.error?.code});if(pending!==job||scope.version!==snapshot.version){$('messages').dataset.staleDropped=String(1+Number($('messages').dataset.staleDropped||0));return;}if(!d||typeof d.text!=='string'||!d.text.trim()||!Object.hasOwn(d,'productId'))throw new Error('响应格式不完整');if(d.productId!==snapshot.productId||d.selectionSeq!==snapshot.seq||(d.evidence||[]).some(x=>x.productId!==snapshot.productId))throw new Error('响应商品与所选商品不一致，本条已拦截');slot.row.className='turn assistant';slot.row.dataset.card=snapshot.productId||'none';slot.row.dataset.seq=String(d.selectionSeq);slot.lab.textContent='珠宝智能体 · '+caption;slot.body.textContent=d.text;addEvidence(slot.row,d);
}catch(err){if(pending!==job||scope.version!==snapshot.version){$('messages').dataset.staleErrors=String(1+Number($('messages').dataset.staleErrors||0));return;}slot.row.dataset.errorCode=err.code||'NETWORK';slot.lab.textContent='界面提示';slot.body.textContent=timedOut?'本地服务响应超时；未显示回复。':'没有取得本条回复：'+(typeof err.message==='string'?err.message.slice(0,120):'本地服务不可用')+'。';}finally{clearTimeout(timer);if(pending===job)pending=null;refreshSend();scrollEnd();}};
foot();refreshSend();$('messages').dataset.staleDropped='0';$('messages').dataset.staleErrors='0';syncSession().catch(()=>{$('foot').textContent='会话未打开，请从测试店本机启动入口进入。'}).finally(refreshSend);
</script>
</body></html>
